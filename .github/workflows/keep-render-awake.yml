name: Keep Render Awake

# Se ejecuta cada 10 minutos
on:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          URL="https://api-modelo-ia-3.onrender.com/"  # <-- Cambia esto por tu URL de Render
          echo "🔹 Ping a Render: $URL"

          # Hacemos el ping con curl y manejamos errores
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL || echo "000")
          echo "Código HTTP recibido: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "✅ Render está activo"
          else
            echo "⚠️ Render no respondió o hay error"
          fi
